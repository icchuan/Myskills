name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验技能目录与元数据
        run: python3 tools/catalog.py verify
      - name: 确认 README 目录表与 skills.json 同步
        run: |
          python3 tools/catalog.py render
          git diff --exit-code README.md
